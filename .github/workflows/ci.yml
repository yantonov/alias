on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

name: ci

jobs:
  build_and_test:
    name: Rust project (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # on windows-latest this is Git Bash, the shell the tool targets there
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          # the action installs a minimal toolchain, clippy has to be asked for
          components: clippy
      - run: cargo build
      # linted on every operating system rather than on one: half of the
      # platform specific code is behind cfg and is invisible to the others
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  msrv:
    # keeps rust-version in Cargo.toml honest
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo build
      - run: cargo test
