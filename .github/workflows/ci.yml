on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

name: ci

jobs:
  build_and_test:
    name: Rust project (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # on windows-latest this is Git Bash, the shell the tool targets there
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - run: cargo build
      - run: cargo test
